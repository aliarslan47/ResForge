[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resforge"
version = "0.1.0"
description = "ResForge — AMR genotip→fenotip tahmin güvenilirliği (çoklu-araç uyuşmazlığı)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "pandas>=2"]

[project.scripts]
resforge = "resforge.cli:main"

[tool.setuptools.packages.find]
include = ["resforge*"]
