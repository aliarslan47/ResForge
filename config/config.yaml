# ResForge yapılandırması. KURAL: kodda mutlak yol YOK — her şey ${RESFORGE_*}'ten çözülür.
project:
  name: ResForge
  version: "0.1.0"
  species: "Acinetobacter baumannii"   # ilk çalışılan tür

paths:
  home: "${RESFORGE_HOME}"
  db: "${RESFORGE_DB}"          # opsiyonel harici AMR DB kökü; yoksa araçlar kendi varsayılan DB'sini kullanır
  work: "${RESFORGE_WORK}"      # runs/
  data: "${RESFORGE_HOME}/data" # genomes/ + ast.tsv (Ali doldurur, git'e girmez)

resources:
  reserve_cores: 1
  thread_fraction: 0.8

# Girdi kohortu
input:
  genomes_glob: "${RESFORGE_HOME}/data/genomes/*.fasta"
  ast_table: "${RESFORGE_HOME}/data/ast.tsv"   # sütunlar: genome_id, antibiotic, phenotype(R/S/I)

# Hangi tarayıcılar çalışsın (dürüst: kurulu olmayan/başarısız = WARNING)
scanners:
  amrfinderplus: true
  rgi: true
  abricate_card: true
  abricate_resfinder: true

# Araç parametreleri
tools:
  amrfinderplus:
    organism: "Acinetobacter_baumannii"   # AMRFinder --organism (nokta-mutasyon çağrısı için)
    extra: ["--plus"]
  abricate:
    min_identity: 80
    min_coverage: 80

# Uyuşmazlık analizi
concordance:
  identity_threshold: 90   # bu eşiğin altındaki çağrılar 'zayıf' işaretlenir

# Fenotip merceği (s04)
phenotype:
  # İlaç-özgü katman kapısı: bir ilacın sınıf-hitlerinin en az bu oranı o ilaç adını
  # (antimicrobial_agent) taşımalı → aksi halde sınıf katmanında kal. "≥1 kez" (0.0)
  # ölçekte kırılgan (tek başıboş etiket kapıyı açıp felakete yol açtı — n=300 denemesi).
  # Fenotibe kör (yalnız genotip-etiket sözlüğü) → veri sızıntısı yok.
  drug_name_coverage_min: 0.05
